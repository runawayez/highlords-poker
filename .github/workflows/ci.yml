name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm exec wrangler deploy --dry-run --config apps/worker/wrangler.jsonc
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Verificar Chrome do runner
        run: google-chrome --version
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-previews
          path: test-results/ui-*.png
          retention-days: 7
  windows-deploy-script:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm worker:deploy --dry-run
        env:
          CONFIRM_FREE_PLAN: 'yes'
          WRANGLER_SEND_METRICS: 'false'

  deploy-worker:
    name: Publicar Worker
    needs: [check, windows-deploy-script]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - name: Verificar configuração da Cloudflare
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Publicação automática pendente: cadastre CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID nos secrets do repositório. Consulte docs/deployment.md.'
            echo '### Publicação não executada' >> "$GITHUB_STEP_SUMMARY"
            echo 'Faltam os secrets CLOUDFLARE_API_TOKEN e/ou CLOUDFLARE_ACCOUNT_ID. Cadastre-os uma única vez e execute Verify novamente pela aba Actions, usando Run workflow na branch main.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Verificar se este ainda é o commit atual
        if: steps.cloudflare.outputs.enabled == 'true'
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Commit substituído na main; a execução mais recente fará a publicação.'
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.head.outputs.current == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.head.outputs.current == 'true'
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.head.outputs.current == 'true'
        with:
          node-version: 24
          cache: pnpm
      - name: Instalar dependências
        if: steps.head.outputs.current == 'true'
        run: pnpm install --frozen-lockfile
      - name: Publicar backend na Cloudflare
        if: steps.head.outputs.current == 'true'
        run: pnpm worker:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIRM_FREE_PLAN: 'yes'
          WRANGLER_SEND_METRICS: 'false'
      - name: Verificar API publicada
        if: steps.head.outputs.current == 'true'
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 5 --max-time 15 \
            https://highlords-poker-api.highlords.workers.dev/api/health \
            | node --input-type=module -e 'let body=""; for await (const chunk of process.stdin) body += chunk; const data=JSON.parse(body); if (data.ok !== true || data.policy !== "highlords-nlhe-v1") process.exit(1);'
          echo '### Worker publicado e API verificada' >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
