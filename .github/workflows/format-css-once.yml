name: Stabilize CSS formatting
on:
  push:
    paths:
      - .github/workflows/format-css-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Normalize CSS until stable
        run: |
          pnpm exec prettier --write apps/web/src/experience.css
          pnpm exec prettier --write apps/web/src/experience.css
          pnpm exec prettier --check apps/web/src/experience.css
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/experience.css
          if ! git diff --staged --quiet; then
            git commit -m "style: stabilize experience CSS formatting"
            git push origin HEAD:main
          fi
