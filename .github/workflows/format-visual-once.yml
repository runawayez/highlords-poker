name: Format legacy visual assets
on:
  push:
    paths:
      - .github/workflows/format-visual-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/src/experience.css apps/web/src/premium.css docs/experience-redesign.md docs/visual-redesign.md
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/experience.css apps/web/src/premium.css docs/experience-redesign.md docs/visual-redesign.md
          if ! git diff --staged --quiet; then
            git commit -m "style: format legacy visual assets"
            git push origin HEAD:main
          fi
