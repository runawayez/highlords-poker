name: Format guest onboarding
on:
  push:
    paths:
      - .github/workflows/format-guest-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format onboarding files
        run: pnpm exec prettier --write apps/web/src/preferences.ts apps/web/src/components.tsx apps/web/src/main.tsx apps/web/src/quick-profile.css apps/web/src/i18n/locales/pt-BR/profile.json apps/web/src/i18n/locales/en/profile.json tests/e2e/club.spec.ts
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/preferences.ts apps/web/src/components.tsx apps/web/src/main.tsx apps/web/src/quick-profile.css apps/web/src/i18n/locales/pt-BR/profile.json apps/web/src/i18n/locales/en/profile.json tests/e2e/club.spec.ts
          if ! git diff --staged --quiet; then
            git commit -m "style: format instant guest onboarding"
            git push origin HEAD:main
          fi
