name: Format chat regressions once
on:
  push:
    paths:
      - .github/workflows/format-chat-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/src/club-premium.css tests/e2e/club.spec.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/club-premium.css tests/e2e/club.spec.ts
          if ! git diff --staged --quiet; then
            git commit -m "style: format chat layout regression tests"
            git push origin HEAD:main
          fi
